version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types:
          - minor
          - patch
